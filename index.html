<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="icon" type="image/png" href="image/love.ico" />
    <title>I ♥ You</title>
    <link type="text/css" rel="stylesheet" href="./js/default.css" />
    <script type="text/javascript" src="./js/jquery.min.js"></script>
    <script type="text/javascript" src="./js/jscex.min.js"></script>
    <script type="text/javascript" src="./js/jscex-parser.js"></script>
    <script type="text/javascript" src="./js/jscex-jit.js"></script>
    <script type="text/javascript" src="./js/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./js/jscex-async.min.js"></script>
    <script
      type="text/javascript"
      src="./js/jscex-async-powerpack.min.js"
    ></script>
    <script
      type="text/javascript"
      src="./js/functions.js"
      charset="utf-8"
    ></script>
    <script type="text/javascript" src="./js/love.js" charset="utf-8"></script>

    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        background: #ffe;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #main {
        position: relative;
        width: 1100px;
        height: 680px;
      }
      #error {
        display: none;
      }
      /* Fix lỗi layer chữ che mất nút click */
      #text {
        position: absolute;
        z-index: 0;
        pointer-events: none;
      }
      /* Canvas phải nằm trên cùng để nhận click */
      #canvas {
        position: relative;
        z-index: 10;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="error">Trình duyệt không hỗ trợ.</div>
      <div id="wrap">
        <div id="text">
          <div id="code">
            <span class="say">Hê Hê,</span><br />
            <span class="say">Cho em cái cây nè</span><br />
            <span class="say">Chúc em vui vẻ nhé!.</span><br />
          </div>
        </div>
        <div id="clock-box">
          <span class="STYLE1"></span><font color="#FF0000"></font>
          <div id="cock"></div>
        </div>
        <canvas id="canvas" width="1100" height="680"></canvas>
      </div>
    </div>

    <script>
      // Biến toàn cục lưu tỉ lệ scale
      window.scaleFactor = 1;

      function autoResize() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var mainDiv = document.getElementById("main");
        var originalWidth = 1100;
        var originalHeight = 680;

        var scaleX = w / originalWidth;
        var scaleY = h / originalHeight;
        window.scaleFactor = Math.min(scaleX, scaleY); // Cập nhật biến scale

        // Nếu muốn full màn hình thì bỏ comment dòng dưới, nhưng cẩn thận vỡ hình
        // if (window.scaleFactor > 1) window.scaleFactor = 1;

        mainDiv.style.transformOrigin = "center center";
        mainDiv.style.transform = "scale(" + window.scaleFactor + ")";
      }

      window.onload = function () {
        autoResize();
        runLoveTree();
      };
      window.onresize = autoResize;
    </script>

    <script>
      function runLoveTree() {
        var canvas = $("#canvas");
        var width = canvas.width();
        var height = canvas.height();

        var opts = {
          seed: { x: width / 2 - 20, color: "rgb(190, 26, 37)", scale: 2 },
          branch: [
            [
              535,
              680,
              570,
              250,
              500,
              200,
              30,
              100,
              [
                [
                  540,
                  500,
                  455,
                  417,
                  340,
                  400,
                  13,
                  100,
                  [[450, 435, 434, 430, 394, 395, 2, 40]],
                ],
                [
                  550,
                  445,
                  600,
                  356,
                  680,
                  345,
                  12,
                  100,
                  [[578, 400, 648, 409, 661, 426, 3, 80]],
                ],
                [539, 281, 537, 248, 534, 217, 3, 40],
                [
                  546,
                  397,
                  413,
                  247,
                  328,
                  244,
                  9,
                  80,
                  [
                    [427, 286, 383, 253, 371, 205, 2, 40],
                    [498, 345, 435, 315, 395, 330, 4, 60],
                  ],
                ],
                [
                  546,
                  357,
                  608,
                  252,
                  678,
                  221,
                  6,
                  100,
                  [[590, 293, 646, 277, 648, 271, 2, 80]],
                ],
              ],
            ],
          ],
          bloom: { num: 700, width: 1080, height: 650 },
          footer: { width: 1200, height: 5, speed: 10 },
        };

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        // --- PHẦN QUAN TRỌNG: FIX CLICK ---
        // Hàm xử lý chung cho cả click chuột và chạm cảm ứng
        function handleInput(e) {
          var offset = canvas.offset();
          var pageX, pageY;

          // Kiểm tra xem là touch hay click
          if (e.type === "touchstart") {
            pageX = e.originalEvent.touches[0].pageX;
            pageY = e.originalEvent.touches[0].pageY;
          } else {
            pageX = e.pageX;
            pageY = e.pageY;
          }

          // CÔNG THỨC SỬA LỖI: Chia cho scaleFactor để lấy tọa độ gốc
          // Đồng thời cộng bù trừ tọa độ do việc căn giữa màn hình gây ra
          var x = (pageX - offset.left) / window.scaleFactor;
          var y = (pageY - offset.top) / window.scaleFactor;

          if (seed.hover(x, y)) {
            hold = 0;
            canvas.unbind("click");
            canvas.unbind("mousemove");
            canvas.unbind("touchstart");
            canvas.removeClass("hand");
          }
        }

        canvas.click(handleInput);
        canvas.on("touchstart", handleInput); // Thêm sự kiện chạm cho mobile

        canvas.mousemove(function (e) {
          var offset = canvas.offset();
          var x = (e.pageX - offset.left) / window.scaleFactor;
          var y = (e.pageY - offset.top) / window.scaleFactor;
          canvas.toggleClass("hand", seed.hover(x, y));
        });
        // -----------------------------------

        var seedAnimate = eval(
          Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
              $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
              seed.scale(0.95);
              $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
              seed.move(0, 2);
              foot.draw();
              $await(Jscex.Async.sleep(10));
            }
          }),
        );

        var growAnimate = eval(
          Jscex.compile("async", function () {
            do {
              tree.grow();
              $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
          }),
        );

        var flowAnimate = eval(
          Jscex.compile("async", function () {
            do {
              tree.flower(2);
              $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
          }),
        );

        var moveAnimate = eval(
          Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
              foot.draw();
              $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas
              .parent()
              .css("background", "url(" + tree.toDataURL("image/png") + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
          }),
        );

        var jumpAnimate = eval(
          Jscex.compile("async", function () {
            var ctx = tree.ctx;
            while (true) {
              tree.ctx.clearRect(0, 0, width, height);
              tree.jump();
              foot.draw();
              $await(Jscex.Async.sleep(25));
            }
          }),
        );

        var textAnimate = eval(
          Jscex.compile("async", function () {
            var together = new Date();
            together.setFullYear(2020, 10, 20);
            together.setHours(0);
            together.setMinutes(0);
            together.setSeconds(0);
            together.setMilliseconds(0);

            $("#code").show().typewriter();
            $("#clock-box").fadeIn(500);

            while (true) {
              timeElapse(together);
              $await(Jscex.Async.sleep(1000));
            }
          }),
        );

        var runAsync = eval(
          Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            textAnimate().start();
            $await(jumpAnimate());
          }),
        );

        runAsync().start();
      }
    </script>
  </body>
</html>
